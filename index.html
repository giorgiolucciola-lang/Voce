<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Voce — pratica quotidiana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E7E0D2;
    --surface: #F4EFE4;
    --surface-2: #FBF8F1;
    --ink: #202B27;
    --ink-soft: #57635D;
    --accent: #3E7C74;
    --accent-deep: #2C5B54;
    --gold: #C9A15A;
    --line: rgba(32,43,39,0.14);
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header{
    display:flex;
    align-items:flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 38px);
    margin: 0;
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .date{
    font-size: 13px;
    color: var(--ink-soft);
    text-transform: capitalize;
    margin-top: 6px;
  }
  .streak{
    text-align: right;
  }
  .streak .num{
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 600;
    color: var(--accent-deep);
    line-height: 1;
  }
  .streak .lbl{
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* breathing signature element */
  .breath-card{
    background: var(--surface);
    border-radius: var(--radius);
    padding: 26px 20px;
    display:flex;
    align-items:center;
    gap: 20px;
    margin-bottom: 24px;
    border: 1px solid var(--line);
  }
  .breath-orb{
    position:relative;
    width: 74px;
    height: 74px;
    flex-shrink:0;
  }
  .breath-orb svg{ width:100%; height:100%; }
  .breath-orb circle{
    transform-origin: center;
    animation: breathe 8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%, 100% { transform: scale(0.62); opacity: 0.55; }
    50% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .breath-orb circle{ animation: none; transform: scale(0.85); }
  }
  .breath-text .t{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    margin-bottom: 4px;
  }
  .breath-text .d{
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .section-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin: 28px 0 10px;
  }

  .exercise{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    display:flex;
    align-items:flex-start;
    gap: 14px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .exercise.done{
    background: var(--surface-2);
    border-color: var(--accent);
  }
  .check{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: transparent;
    transition: background 0.15s ease;
  }
  .check svg{ width: 13px; height:13px; opacity:0; transition: opacity 0.15s ease; }
  .exercise.done .check{ background: var(--accent); }
  .exercise.done .check svg{ opacity:1; }
  .ex-body{ flex:1; }
  .ex-name{
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 3px;
  }
  .ex-desc{
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .ex-time{
    font-size: 11px;
    color: var(--accent-deep);
    font-weight: 600;
    margin-top: 6px;
    letter-spacing: 0.03em;
  }

  .note-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-top: 24px;
  }
  .note-card label{
    display:block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  textarea{
    width: 100%;
    min-height: 64px;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    resize: vertical;
    outline: none;
    line-height: 1.5;
  }

  .calendar{
    display:flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .dot{
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--line);
  }
  .dot.filled{ background: var(--accent); }
  .dot.today{ box-shadow: 0 0 0 2px var(--gold); }

  .status{
    font-size: 12px;
    color: var(--ink-soft);
    text-align:center;
    margin-top: 18px;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Voce</h1>
      <div class="date" id="today-label"></div>
    </div>
    <div class="streak">
      <div class="num" id="streak-num">0</div>
      <div class="lbl">giorni di fila</div>
    </div>
  </header>

  <div class="breath-card">
    <div class="breath-orb">
      <svg viewBox="0 0 74 74">
        <circle cx="37" cy="37" r="30" fill="var(--accent)"></circle>
      </svg>
    </div>
    <div class="breath-text">
      <div class="t">Prima di iniziare, respira</div>
      <div class="d">Segui il cerchio per due o tre cicli: inspira mentre si espande, espira mentre si ritira. Serve a preparare il fiato, non a misurare il tempo.</div>
    </div>
  </div>

  <div class="section-label">Esercizi di oggi</div>
  <div id="exercise-list"></div>

  <div class="note-card">
    <label for="note">Note di oggi</label>
    <textarea id="note" placeholder="Com'era la voce oggi? Cosa hai notato?"></textarea>
  </div>

  <div class="section-label">Ultimi 30 giorni</div>
  <div class="calendar" id="calendar"></div>

  <div class="status" id="status"></div>
</div>

<script>
const EXERCISES = [
  {
    id: 'respiro',
    name: 'Respirazione diaframmatica',
    desc: 'Seduto, una mano sul petto e una sull\'addome. Inspira dal naso gonfiando l\'addome (il petto resta fermo), espira lentamente dalla bocca. 8-10 respiri.',
    time: '2 min'
  },
  {
    id: 'risonanza',
    name: 'Risonanza — "mmm" e sbadiglio-sospiro',
    desc: 'Emetti un "mmm" a labbra chiuse, cercando la vibrazione sulle labbra/naso più che in gola. Poi lo sbadiglio-sospiro: inspira come uno sbadiglio, espira con un suono rilassato dall\'acuto al grave.',
    time: '3 min'
  },
  {
    id: 'articolazione',
    name: 'Articolazione — sequenze consonantiche',
    desc: 'Ripeti lentamente e poi più veloce, esagerando il movimento di labbra e lingua: "pa-ta-ka", "ba-da-ga", "la-la-la". Poi qualche scioglilingua a bassa velocità.',
    time: '3 min'
  },
  {
    id: 'lettura',
    name: 'Lettura ad alta voce',
    desc: 'Leggi un breve testo (un articolo, una pagina di libro) a voce alta e proiettata, come se dovessi farti sentire in fondo a una stanza, senza sforzare la gola.',
    time: '5 min'
  }
];

function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function fmtDateLabel(){
  const d = new Date();
  return d.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
}

let log = {}; // { "YYYY-MM-DD": { completed: [ids], note: "" } }

async function loadLog(){
  try{
    const res = await window.storage.get('practice-log', false);
    log = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    log = {};
  }
}

async function saveLog(){
  try{
    await window.storage.set('practice-log', JSON.stringify(log), false);
  }catch(e){
    setStatus('Non sono riuscito a salvare. Riprova.');
  }
}

function setStatus(msg){
  document.getElementById('status').textContent = msg;
  if(msg) setTimeout(()=>{ document.getElementById('status').textContent=''; }, 2000);
}

function getDay(key){
  if(!log[key]) log[key] = { completed: [], note: '' };
  return log[key];
}

function computeStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const key = d.toISOString().slice(0,10);
    const day = log[key];
    const total = EXERCISES.length;
    if(day && day.completed && day.completed.length === total){
      streak++;
      d.setDate(d.getDate()-1);
    } else {
      break;
    }
  }
  return streak;
}

function renderExercises(){
  const key = todayKey();
  const day = getDay(key);
  const list = document.getElementById('exercise-list');
  list.innerHTML = '';
  EXERCISES.forEach(ex => {
    const done = day.completed.includes(ex.id);
    const el = document.createElement('div');
    el.className = 'exercise' + (done ? ' done' : '');
    el.innerHTML = `
      <div class="check" data-id="${ex.id}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="ex-body">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-desc">${ex.desc}</div>
        <div class="ex-time">${ex.time}</div>
      </div>
    `;
    el.querySelector('.check').addEventListener('click', () => toggleExercise(ex.id));
    list.appendChild(el);
  });
}

async function toggleExercise(id){
  const key = todayKey();
  const day = getDay(key);
  const idx = day.completed.indexOf(id);
  if(idx === -1) day.completed.push(id);
  else day.completed.splice(idx,1);
  await saveLog();
  renderExercises();
  renderStreak();
  renderCalendar();
  setStatus('Salvato');
}

function renderStreak(){
  document.getElementById('streak-num').textContent = computeStreak();
}

function renderCalendar(){
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  const today = todayKey();
  for(let i=29; i>=0; i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const day = log[key];
    const done = day && day.completed && day.completed.length === EXERCISES.length;
    const dot = document.createElement('div');
    dot.className = 'dot' + (done ? ' filled' : '') + (key === today ? ' today' : '');
    dot.title = key;
    cal.appendChild(dot);
  }
}

let noteTimer = null;
function initNote(){
  const key = todayKey();
  const day = getDay(key);
  const textarea = document.getElementById('note');
  textarea.value = day.note || '';
  textarea.addEventListener('input', () => {
    day.note = textarea.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(async () => {
      await saveLog();
      setStatus('Salvato');
    }, 700);
  });
}

async function init(){
  document.getElementById('today-label').textContent = fmtDateLabel();
  await loadLog();
  renderExercises();
  renderStreak();
  renderCalendar();
  initNote();
}

init();
</script>
</body>
</html>
